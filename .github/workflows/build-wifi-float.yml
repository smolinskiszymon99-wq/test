name: Zbuduj Wi-Fi Float (APK)

on:
  push:
    branches: [main]
    paths: ["android-wifi-float/**", ".github/workflows/build-wifi-float.yml"]
  pull_request:
    paths: ["android-wifi-float/**", ".github/workflows/build-wifi-float.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Sekret KEYSTORE_BASE64 nie może być w warunku if (GitHub odrzuca cały workflow).
      # Bez sekretu APK jest podpisany kluczem debug.
      - name: Przygotuj klucz podpisu
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Brak sekretu KEYSTORE_BASE64 - APK zostanie podpisany kluczem debug."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Zbuduj APK
        working-directory: android-wifi-float
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/WifiFloat.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: WifiFloat-apk
          path: ${{ runner.temp }}/WifiFloat.apk

      - name: Opublikuj w Releases
        if: ${{ github.event_name != 'pull_request' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wifi-float-build-${{ github.run_number }}
          name: Wi-Fi Float – build ${{ github.run_number }}
          body: |
            Plik `WifiFloat.apk` – pływający przycisk Wi-Fi na Android 8+.
            Instrukcja i komendy ADB: `android-wifi-float/README.md`.
          files: ${{ runner.temp }}/WifiFloat.apk
